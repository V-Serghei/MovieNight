name: CD - deploy to k8s

on:
  push:
    branches: [ main, develop ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    needs: [test, docker]
    env:
      BRANCH: ${{ github.ref_name }}
      OWNER: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "latest"

      - name: Write kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${KUBE_CONFIG}" > $HOME/.kube/config
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}

      - name: Pick namespace
        id: ns
        run: |
          if [ "${BRANCH}" = "develop" ]; then
            echo "ns=movienight-dev" >> $GITHUB_OUTPUT
          else
            echo "ns=movienight-prod" >> $GITHUB_OUTPUT
          fi

      - name: Ensure namespace exists
        run: |
          kubectl get ns "${{ steps.ns.outputs.ns }}" >/dev/null 2>&1 || \
            kubectl create ns "${{ steps.ns.outputs.ns }}"

      - name: Apply manifests
        run: kubectl apply -n "${{ steps.ns.outputs.ns }}" -f k8s/

      - name: Update gateway image to branch tag
        run: |
          kubectl set image -n "${{ steps.ns.outputs.ns }}" \
            deployment/movienight-gateway \
            gateway=ghcr.io/${OWNER}/movienight-gateway:${BRANCH}

      - name: Wait for gateway rollout
        run: kubectl -n "${{ steps.ns.outputs.ns }}" rollout status deployment/movienight-gateway --timeout=180s
